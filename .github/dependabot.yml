version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    versioning-strategy: increase
    ignore:
      # The runner is pinned exactly and version-coupled to the browser build;
      # bumping it is a deliberate integrator decision, not automation's.
      # qualityforge is deliberately NOT ignored: a bump PR is exactly how this
      # template is meant to move to the next published release — reviewed, with
      # CI proving the template is still green on it.
      - dependency-name: "@playwright/test"
